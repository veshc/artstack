name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  freshness:
    name: skills are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The generated SKILL.md files are committed so Claude Code can read them
      # at skill-load time, when there is no build step available. That only
      # works if they actually match their templates, so the build is the gate.
      - name: Generated skills match their templates
        run: ./build --dry-run

      # Belt and braces: regenerate and confirm the tree is unchanged. Catches
      # anything --dry-run's comparison might miss.
      - name: No drift after a real build
        run: |
          ./build
          git diff --exit-code

  shellcheck:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in build setup bin/*; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -q 'bash' || continue
            bash -n "$f" || exit 1
          done
      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Informational: style findings should not block a docs change.
          shellcheck -S error build setup bin/* || true

  posture:
    name: enterprise posture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs/security.md promises no network egress. Enforce the promise rather
      # than trusting the document, and make a violation a review conversation.
      - name: No network calls in scripts
        run: |
          # Word boundaries matter here. Without them "ping " matches inside
          # "skipping ", and "nc " inside plenty of prose - this gate produced
          # three false positives before the boundaries went in, each one a
          # comment or a message rather than a call.
          if grep -rnE '(^|[^[:alnum:]_-])(curl|wget|nc|ping)([[:space:]]|$)' \
               build setup bin/ --exclude=artstack-guard \
               | grep -vE '^\s*[^:]+:[0-9]+:\s*#' ; then
            echo "Network command found in an ArtStack script."
            echo "ArtStack makes no network calls. See docs/security.md."
            exit 1
          fi

          # artstack-guard names these commands inside awk detection patterns:
          # its job is to look FOR them in untrusted tracker text and mark the
          # line [SUSPECT]. Naming a command in a pattern is not invoking one,
          # so assert the stronger property instead - that it never runs one.
          if grep -nE '^[[:space:]]*(curl|wget|nc|ping)[[:space:]]' bin/artstack-guard; then
            echo "artstack-guard invokes a network command."
            exit 1
          fi
          echo "No network commands."

      # Every domain skill must carry the tracker boundary. The router is the
      # only file exempt: it routes, it never reads a work item.
      - name: Tracker read-only rule present in every domain skill
        run: |
          missing="$(grep -L 'tracker stays read-only' skills/*/SKILL.md | grep -v 'skills/artstack/SKILL.md' || true)"
          if [ -n "$missing" ]; then
            echo "Missing the tracker read-only rule:"; echo "$missing"; exit 1
          fi
          echo "All domain skills carry the tracker boundary."

      # The rule people will judge this tool on.
      # Every skill that can write to the repo must carry the git boundary, and
      # none of them may claim the authority to land work. On a train the merge
      # belongs to the humans who own the gate.
      - name: Write-capable skills carry the git boundary
        run: |
          for f in skills/implement/SKILL.md skills/ship/SKILL.md \
                   skills/investigate/SKILL.md skills/automate/SKILL.md \
                   skills/regression/SKILL.md skills/verify/SKILL.md; do
            [ -f "$f" ] || continue
            case "$f" in
              */verify/*) continue ;;   # read-only by design
            esac
            grep -q 'Working with git on a train' "$f" \
              || { echo "missing git boundary: $f"; exit 1; }
          done
          echo "All write-capable skills carry the git boundary."

      - name: No skill claims authority to merge or push to main
        run: |
          # Derived, not listed. A hardcoded exemption list goes stale the next
          # time a read-only skill is added, and a stale allowlist in a safety
          # gate fails in the dangerous direction. The property that actually
          # matters is whether a skill can write at all: only a skill holding
          # Write or Edit can land anything, so only those must carry the rule.
          bad=0
          for f in skills/*/SKILL.md; do
            fm="$(sed -n '1,/^---$/{2,$p;}' "$f" | sed -n '/^allowed-tools:/,/^[a-z-]*:/p')"
            printf '%s' "$fm" | grep -qE '^[[:space:]]*-[[:space:]]*(Write|Edit)[[:space:]]*$' || continue
            grep -qE 'Never (merge|push to)|Do not merge' "$f" && continue
            echo "write-capable skill with no merge prohibition: $f"; bad=1
          done
          [ "$bad" = "0" ] || exit 1
          echo "Every write-capable skill prohibits merging."

      - name: Open questions rule present in every skill
        run: |
          missing="$(grep -L 'Open questions' skills/*/SKILL.md || true)"
          if [ -n "$missing" ]; then
            echo "Missing the open-questions rule:"; echo "$missing"; exit 1
          fi
          echo "All skills carry the open-questions rule."

  install:
    name: setup works from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install into a temp skills dir
        run: |
          export CLAUDE_SKILLS_DIR="$RUNNER_TEMP/skills"
          export ARTSTACK_HOME="$RUNNER_TEMP/home"
          ./setup
          test -L "$CLAUDE_SKILLS_DIR/artstack" || { echo "router not linked"; exit 1; }
          test -L "$CLAUDE_SKILLS_DIR/review"   || { echo "review not linked"; exit 1; }
          ./setup --check

      - name: A foreign skill of the same name is never clobbered
        run: |
          export CLAUDE_SKILLS_DIR="$RUNNER_TEMP/skills2"
          export ARTSTACK_HOME="$RUNNER_TEMP/home2"
          mkdir -p "$CLAUDE_SKILLS_DIR/review"
          printf -- '---\nname: review\n---\nnot ours\n' > "$CLAUDE_SKILLS_DIR/review/SKILL.md"
          ./setup
          grep -q 'not ours' "$CLAUDE_SKILLS_DIR/review/SKILL.md" \
            || { echo "setup destroyed a foreign skill"; exit 1; }
          test -L "$CLAUDE_SKILLS_DIR/artstack-review" \
            || { echo "collision fallback did not install"; exit 1; }

      - name: Uninstall is clean and leaves foreign skills alone
        run: |
          export CLAUDE_SKILLS_DIR="$RUNNER_TEMP/skills2"
          export ARTSTACK_HOME="$RUNNER_TEMP/home2"
          ./setup --uninstall
          grep -q 'not ours' "$CLAUDE_SKILLS_DIR/review/SKILL.md" \
            || { echo "uninstall destroyed a foreign skill"; exit 1; }
          test ! -L "$CLAUDE_SKILLS_DIR/artstack-review" \
            || { echo "uninstall left a link behind"; exit 1; }

  ledger:
    name: ledger substrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Substrate tests
        run: ./test/ledger.sh -v

      # The guard that exists because two sessions once shared this tree and
      # one nearly committed the other's half-written files.
      - name: build refuses to write into an unsafe tree
        run: |
          echo "x" > scratch.txt && git add scratch.txt
          if ./build; then echo "build wrote despite staged foreign content"; exit 1; fi
          ARTSTACK_PREFLIGHT_WARN=1 ./build || { echo "override did not work"; exit 1; }
          git reset -q && rm -f scratch.txt

  context:
    name: context resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The bug this replaces: an @context/ include that silently resolved to
      # nothing, so commands ran with no train context and never said so.
      - name: Resolves files created by --init-context
        run: |
          proj="$RUNNER_TEMP/proj"
          mkdir -p "$proj" && cd "$proj"
          git init -q . && git -c user.email=c@i -c user.name=ci commit -q --allow-empty -m init
          "$GITHUB_WORKSPACE/setup" --init-context
          out="$("$GITHUB_WORKSPACE/bin/artstack-context" --print)"
          echo "$out"
          echo "$out" | grep -q 'NOT FOUND' && { echo "context did not resolve"; exit 1; }
          echo "$out" | grep -q "$proj/.artstack/art.md"  || { echo "wrong train file"; exit 1; }
          echo "$out" | grep -q "$proj/.artstack/team.md" || { echo "wrong team file"; exit 1; }

      # This is a train: several teams share one art.md and each has its own
      # team file. Team identity has to resolve to a NAME, because everything
      # recorded downstream is keyed by it.
      - name: Scaffolds a named team on the train
        run: |
          proj="$RUNNER_TEMP/train"
          mkdir -p "$proj" && cd "$proj"
          git init -q . && git -c user.email=c@i -c user.name=ci commit -q --allow-empty -m init
          "$GITHUB_WORKSPACE/setup" --init-context --team Falcon
          test -f .artstack/teams/Falcon.md || { echo "team file not created"; exit 1; }
          grep -q '^Falcon$' .artstack/active-team || { echo "active-team not set"; exit 1; }
          out="$("$GITHUB_WORKSPACE/bin/artstack-context" --print)"
          echo "$out"
          echo "$out" | grep -q 'team      : Falcon' || { echo "team name unresolved"; exit 1; }

      # Picking a team silently is how a review gets filed against the wrong
      # team's backlog. Ambiguity must surface, not resolve itself.
      - name: Several teams and no selection is AMBIGUOUS, never a guess
        run: |
          proj="$RUNNER_TEMP/train"
          cd "$proj"
          cp "$GITHUB_WORKSPACE/context/team.md.template" .artstack/teams/orion.md
          rm .artstack/active-team
          vars="$("$GITHUB_WORKSPACE/bin/artstack-context")"
          echo "$vars"
          echo "$vars" | grep -q 'ARTSTACK_TEAM_AMBIGUOUS=true' || { echo "ambiguity not reported"; exit 1; }
          echo "$vars" | grep -q 'ARTSTACK_TEAM_NAME=$'         || { echo "guessed a team anyway"; exit 1; }
          echo "$vars" | grep -q 'ARTSTACK_TEAMS_COUNT=2'       || { echo "team count wrong"; exit 1; }

      - name: --team resolves the ambiguity
        run: |
          cd "$RUNNER_TEMP/train"
          out="$("$GITHUB_WORKSPACE/bin/artstack-context" --team orion --print)"
          echo "$out"
          echo "$out" | grep -q 'teams/orion.md' || { echo "--team ignored"; exit 1; }
          echo "$out" | grep -q 'via --team'     || { echo "source not reported"; exit 1; }

      # A named team with no file must fail loudly rather than silently falling
      # back to some other team's conventions.
      - name: A named team with no file is reported, not substituted
        run: |
          cd "$RUNNER_TEMP/train"
          vars="$("$GITHUB_WORKSPACE/bin/artstack-context" --team ghost)"
          echo "$vars"
          echo "$vars" | grep -q 'ARTSTACK_TEAM_MISSING=true' || { echo "missing team not reported"; exit 1; }
          echo "$vars" | grep -q 'ARTSTACK_TEAM=$'            || { echo "fell back to another team"; exit 1; }

      - name: Legacy single-team layout still resolves
        run: |
          proj="$RUNNER_TEMP/proj"
          cd "$proj"
          mkdir -p .artstack/teams
          cp .artstack/team.md .artstack/teams/falcon.md
          cp .artstack/team.md .artstack/teams/orion.md
          rm .artstack/team.md
          echo falcon > .artstack/active-team
          out="$("$GITHUB_WORKSPACE/bin/artstack-context" --print)"
          echo "$out"
          echo "$out" | grep -q 'teams/falcon.md' || { echo "active team ignored"; exit 1; }
          echo "$out" | grep -q 'falcon,orion'    || { echo "team list wrong"; exit 1; }
